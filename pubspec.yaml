name: drive_map
description: "Telemetria OBD-II, mappa operativa del motore e score di guida spiegabile."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  file_picker: ^13.1.0
  csv: ^8.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
